# Auto-deploy when you push to main.
# Preferred path: Vercel Git integration on this repo (fafopetro-web project).
# Optional CLI path (this workflow): set repo Actions secrets VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID. Without those secrets the job is skipped
# cleanly so the check stays green — Vercel still deploys from the Git hook.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build for Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy production
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  skip-notice:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN == '' }}
    steps:
      - name: Vercel Git integration owns production
        run: |
          echo "VERCEL_TOKEN is not set. Skipping CLI deploy."
          echo "Production is https://fafopetro-web.vercel.app via Vercel Git integration on main."
